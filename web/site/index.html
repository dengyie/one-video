<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneVideo 放映室</title>
<meta name="description" content="OneVideo 流水线产出的视频">
<link rel="alternate" type="application/rss+xml" title="OneVideo 放映室" href="/feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1530'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f8; --line: #dde2ee;
  --text: #0e1630; --muted: #5b6684; --accent: #2563eb; --accent-2: #0891b2;
  --chip: #e8eefc; --chip-on: #2563eb; --chip-on-text: #fff; --shadow: 0 1px 2px rgba(14,22,48,.06), 0 8px 24px rgba(14,22,48,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c1c; --surface: #0e1630; --surface-2: #131d3b; --line: #1f2a4d;
    --text: #e8ecf8; --muted: #8b96b8; --accent: #5b8cff; --accent-2: #22d3ee;
    --chip: #17224a; --chip-on: #22d3ee; --chip-on-text: #04111a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #070c1c; --surface: #0e1630; --surface-2: #131d3b; --line: #1f2a4d;
  --text: #e8ecf8; --muted: #8b96b8; --accent: #5b8cff; --accent-2: #22d3ee;
  --chip: #17224a; --chip-on: #22d3ee; --chip-on-text: #04111a; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
header { display: flex; align-items: center; gap: 12px; padding: 20px 0 16px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }
.logo svg { width: 14px; height: 14px; fill: var(--accent-2); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .count { color: var(--muted); font-size: 13px; margin-left: auto; }
.player { background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: var(--shadow); }
.player video { width: 100%; height: 100%; display: block; background: #000; }
.meta { padding: 16px 2px 8px; }
.meta h2 { font-size: 22px; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.summary { margin: 12px 0 0; max-width: 72ch; }
.quality select { font: inherit; font-size: 12px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; margin-left: 4px; }
.resume button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
footer a { color: inherit; }
.chapters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; padding: 0; list-style: none; }
.chapters button {
  font: inherit; font-size: 13px; border: 0; cursor: pointer; color: var(--text);
  background: var(--chip); padding: 6px 12px; border-radius: 999px; display: flex; gap: 8px; align-items: baseline;
}
.chapters button .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.chapters button[aria-current="true"] { background: var(--chip-on); color: var(--chip-on-text); }
.chapters button[aria-current="true"] .t { color: inherit; opacity: .75; }
.chapters button:focus-visible, .card:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details { margin: 14px 0 0; border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; width: fit-content; }
details pre { white-space: pre-wrap; word-break: break-word; font: inherit; font-size: 13px; color: var(--muted); margin: 10px 0 0; }
details a { color: var(--accent); }
.transcript .find { display: block; width: 100%; max-width: 320px; margin: 10px 0 0; font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.transcript ol { list-style: none; margin: 8px 0 0; padding: 4px 0; max-height: 340px; overflow: auto; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.transcript li.ch { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px 2px; }
.transcript li button { display: grid; grid-template-columns: 44px 1fr; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--text); background: none; border: 0; padding: 5px 12px; cursor: pointer; }
.transcript li button:hover { background: var(--surface-2); }
.transcript li button[aria-current="true"] { background: var(--chip); }
.transcript li button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.transcript li button .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.transcript mark { background: var(--chip-on); color: var(--chip-on-text); border-radius: 3px; padding: 0 1px; }
.transcript .none { color: var(--muted); font-size: 13px; padding: 6px 12px; }
.actions { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; }
.actions a { color: var(--accent); text-decoration: none; }
.actions a:hover { text-decoration: underline; }
section.list { padding: 28px 0 40px; }
section.list h3 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card {
  display: block; text-decoration: none; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
}
.card[aria-current="true"] { border-color: var(--accent-2); }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.card .info { padding: 10px 12px 12px; }
.card .info b { display: block; font-size: 14px; line-height: 1.4; font-weight: 600; }
.card .info span { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
footer { color: var(--muted); font-size: 12px; padding: 0 0 32px; }
@media (max-width: 600px) {
  .player { border-radius: 0; margin: 0 -16px; }
  .meta h2 { font-size: 19px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></div>
    <h1>OneVideo 放映室</h1>
    <span class="count" id="count"></span>
  </header>
  <main id="main"><p class="empty">加载中…</p></main>
  <footer>由 OneVideo 流水线渲染 · 素材版权与数据来源见各视频说明 · <a href="/feed.xml">RSS 订阅</a></footer>
</div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (t) => { t = Math.max(0, Math.floor(t)); const m = Math.floor(t / 60), s = t % 60; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; };
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  const main = $("#main");
  let videos = [];

  // /w/<slug>?t=<s> (share pages, see web/share.mjs); #<slug>@<s> from older links still works.
  function current() {
    const m = /^\/w\/([a-z0-9-]+)\/?$/.exec(location.pathname);
    const q = new URLSearchParams(location.search).get("t");
    if (m) return { slug: m[1], t: q ? Number(q) : null };
    const [slug, t] = decodeURIComponent(location.hash.slice(1)).split("@");
    return { slug, t: t ? Number(t) : null };
  }
  // Where each video was left off, in this browser only: coming back to it resumes there (a ?t= link
  // wins). Storage can be missing or throw (private mode, blocked site data); then nothing is kept.
  const POS = "onevideo:pos:";
  const loadPos = (slug) => { try { const p = JSON.parse(localStorage.getItem(POS + slug)); return Number.isFinite(p?.t) ? p.t : null; } catch { return null; } };
  const savePos = (slug, t) => { try { if (t == null) localStorage.removeItem(POS + slug); else localStorage.setItem(POS + slug, JSON.stringify({ t: Math.floor(t), at: Date.now() })); } catch {} };
  const go = (slug) => { history.pushState(null, "", `/w/${slug}`); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };

  function render() {
    if (!videos.length) { main.innerHTML = `<p class="empty">还没有已发布的视频</p>`; return; }
    const { slug, t } = current();
    const cur = videos.find((v) => v.slug === slug) ?? videos[0];
    document.title = `${cur.title} · OneVideo 放映室`;
    const saved = t == null ? loadPos(cur.slug) : null;
    const resume = saved != null && saved >= 10 && saved < cur.duration - 15 ? saved : null;
    let start = t ?? resume;
    const tiers = cur.source === "drive" && Array.isArray(cur.renditions) ? cur.renditions : [];
    main.innerHTML = `
      <div class="player">
        <video id="vid" controls playsinline preload="metadata" poster="${esc(cur.poster)}">
          <source ${tiers.length ? "" : `src="${esc(cur.video)}" `}type="video/mp4">
          <track kind="subtitles" srclang="zh" label="中文字幕（外挂）" src="${esc(cur.captions)}">
        </video>
      </div>
      <div class="meta">
        <h2>${esc(cur.title)}</h2>
        <div class="sub"><span>${esc(cur.date)}</span><span>${fmt(cur.duration)}</span><span>${(cur.size / 1048576).toFixed(1)} MB</span>${tiers.length ? `<label class="quality">画质<select id="quality"></select></label>` : ""}${resume != null ? `<span class="resume">从 ${fmt(resume)} 继续 · <button type="button" id="restart">从头播放</button></span>` : ""}</div>
        ${cur.summary ? `<p class="summary">${esc(cur.summary)}</p>` : ""}
        ${cur.chapters.length ? `<ul class="chapters">${cur.chapters.map((c, i) => `<li><button data-i="${i}" data-t="${c.start}"><span class="t">${fmt(c.start)}</span>${esc(c.title)}</button></li>`).join("")}</ul>` : ""}
        <div class="actions"><a href="${esc(cur.video)}" download="${esc(cur.slug)}.mp4">下载 MP4</a><a href="${esc(cur.captions)}" download="${esc(cur.slug)}.vtt">字幕 VTT</a><a href="/w/${esc(cur.slug)}" id="share">复制链接</a></div>
        <details class="transcript" id="transcript" hidden><summary>文稿</summary><input class="find" type="search" placeholder="在文稿里找" aria-label="在文稿里找"><ol></ol></details>
        ${cur.description ? `<details><summary>说明与数据来源</summary><pre>${linkify(cur.description)}</pre></details>` : ""}
      </div>
      ${videos.length > 1 ? `<section class="list"><h3>全部视频</h3><div class="grid">${videos.map((v) => `
        <a class="card" href="/w/${esc(v.slug)}" data-slug="${esc(v.slug)}" ${v.slug === cur.slug ? 'aria-current="true"' : ""}>
          <div class="thumb"><img src="${esc(v.poster)}" alt="" loading="lazy"><span class="dur">${fmt(v.duration)}</span></div>
          <div class="info"><b>${esc(v.title)}</b><span>${esc(v.date)}</span></div>
        </a>`).join("")}</div></section>` : ""}`;

    const vid = $("#vid");
    quality(cur, vid, tiers);
    const btns = [...main.querySelectorAll(".chapters button")];
    const starts = cur.chapters.map((c) => c.start);
    const mark = () => {
      let i = 0;
      for (let k = 0; k < starts.length; k++) if (vid.currentTime + 0.05 >= starts[k]) i = k;
      btns.forEach((b, k) => b.setAttribute("aria-current", String(k === i)));
    };
    if (btns.length) { mark(); vid.addEventListener("timeupdate", mark); }
    btns.forEach((b) => b.addEventListener("click", () => { vid.currentTime = Number(b.dataset.t); vid.play().catch(() => {}); }));
    if (start != null && Number.isFinite(start)) vid.addEventListener("loadedmetadata", () => { if (start) vid.currentTime = start; }, { once: true });
    const end = () => (Number.isFinite(vid.duration) ? vid.duration : cur.duration) - 15;
    const keep = () => { if (vid.currentTime >= end()) savePos(cur.slug, null); else if (vid.currentTime >= 10) savePos(cur.slug, vid.currentTime); };
    let kept = 0;
    vid.addEventListener("timeupdate", () => { if (Math.abs(vid.currentTime - kept) >= 5) { kept = vid.currentTime; keep(); } });
    vid.addEventListener("pause", keep);
    vid.addEventListener("ended", () => savePos(cur.slug, null));
    $("#restart")?.addEventListener("click", (e) => {
      start = 0;
      vid.currentTime = 0;
      savePos(cur.slug, null);
      e.target.closest(".resume").remove();
      vid.play().catch(() => {});
    });
    transcript(cur, vid);
    $("#share").addEventListener("click", (e) => {
      e.preventDefault();
      const url = `${location.origin}/w/${cur.slug}${vid.currentTime > 1 ? "?t=" + Math.floor(vid.currentTime) : ""}`;
      const done = () => { e.target.textContent = "已复制"; setTimeout(() => (e.target.textContent = "复制链接"), 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("链接", url));
      else prompt("链接", url);
    });
    main.querySelectorAll(".card").forEach((a) => a.addEventListener("click", (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      go(a.dataset.slug);
    }));
  }

  // Drive videos load straight from MangoDrive (the Worker redirects to a signed link). With web
  // renditions the player picks a tier (abr.mjs): a quality picked by hand, else the last throughput
  // estimate in this browser, else 720p; while playing it steps down when the buffer fills slower
  // than playback or playback stalls, and remembers the estimate for the next video. If the direct
  // link fails, the same file is relayed through the site once (?via=edge). Switching keeps the
  // position and play state. The download link stays the full cut.
  const QKEY = "onevideo:q", BWKEY = "onevideo:bw";
  const stored = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const store = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const abrLib = import("/abr.mjs");
  abrLib.catch(() => {}); // awaited (and its failure handled) in quality()
  async function quality(cur, vid, tiers) {
    const source = vid.querySelector("source");
    let started = false, waitAt = null;
    const load = (url) => {
      const at = vid.currentTime, playing = !vid.paused && !vid.ended;
      if (at) vid.addEventListener("loadedmetadata", () => { vid.currentTime = at; }, { once: true });
      started = false; waitAt = null;
      source.src = url;
      vid.load();
      if (playing) vid.play().catch(() => {});
    };
    if (cur.source === "drive") source.addEventListener("error", () => {
      const url = source.getAttribute("src") ?? "";
      if (url && !url.includes("via=edge")) load(url + (url.includes("?") ? "&" : "?") + "via=edge");
    });
    if (!tiers.length) return;
    let abr = null;
    try { abr = await abrLib; } catch {}
    if (!vid.isConnected) return;
    if (!abr) { load(cur.video); return; }
    const sel = $("#quality");
    const conn = navigator.connection ?? {};
    const bw = stored(BWKEY);
    let lastKbps = bw && Date.now() - bw.at < 7 * 864e5 ? bw.kbps : null;
    let manual = stored(QKEY); // a tier's q, "src" (the full cut) or null (automatic)
    if (manual !== "src" && !tiers.some((r) => r.q === manual)) manual = null;
    const auto = () => abr.startTier(tiers, { kbps: lastKbps, downlink: conn.downlink, saveData: conn.saveData });
    let i = manual === "src" ? -1 : manual ? tiers.findIndex((r) => r.q === manual) : auto();
    const urlOf = (k) => (k < 0 ? cur.video : tiers[k].video);
    const paint = () => {
      sel.innerHTML = [`<option value="">自动${manual ? "" : ` · ${esc(tiers[i]?.q ?? "")}`}</option>`, ...tiers.map((r) => `<option value="${esc(r.q)}">${esc(r.q)}</option>`), `<option value="src">原画</option>`].join("");
      sel.value = manual ?? "";
    };
    paint();
    load(urlOf(i));
    sel.addEventListener("change", () => {
      manual = sel.value || null;
      store(QKEY, manual);
      const k = manual === "src" ? -1 : manual ? tiers.findIndex((r) => r.q === manual) : auto();
      if (k !== i) { i = k; samples = []; load(urlOf(i)); }
      paint();
    });

    let samples = [], cool = 0;
    vid.addEventListener("playing", () => { started = true; waitAt = null; });
    vid.addEventListener("waiting", () => { if (started && !vid.seeking) waitAt ??= performance.now(); });
    // Chrome serves a forward seek within ~2 MB by waiting for the download in flight instead of
    // asking for the new range; on a lighter tier over a slow link that is most of the file (45 s of
    // 480p at 40 KB/s took 45 s to land). When the gap would take more than a few seconds to fill
    // at the measured rate, reload at the target: the index is at the front, so that is two short
    // requests. Skipped while a load is still settling (readyState < 2), which also stops it
    // re-firing on the position restored after its own reload.
    let lastRate = null;
    vid.addEventListener("seeking", () => {
      samples = []; waitAt = null;
      if (i < 0 || vid.readyState < 2) return;
      const t = vid.currentTime;
      let end = null;
      for (let r = 0; r < vid.buffered.length; r++) {
        if (vid.buffered.start(r) <= t + 0.5 && vid.buffered.end(r) > t + 2) return; // already here
        if (vid.buffered.start(r) <= t) end = Math.max(end ?? 0, vid.buffered.end(r));
      }
      if (end == null) return; // behind or apart from anything buffered: the browser asks for the range itself
      if ((t - end) / Math.max(lastRate ?? 0.5, 0.1) > 4) load(urlOf(i));
    });
    const timer = setInterval(() => {
      if (!vid.isConnected) { clearInterval(timer); return; }
      if (vid.paused || i < 0) { samples = []; return; } // only while trying to play a tier
      const t = vid.currentTime, now = performance.now();
      let end = t;
      for (let r = 0; r < vid.buffered.length; r++) if (vid.buffered.start(r) <= t + 0.5) end = Math.max(end, vid.buffered.end(r));
      const dur = Number.isFinite(vid.duration) ? vid.duration : cur.duration;
      if (end >= dur - 0.5) { samples = []; return; } // all loaded: nothing left to measure
      samples.push({ at: now, end, ahead: end - t });
      if (samples.length > 20) samples.shift();
      // Buffered seconds × the file's average bitrate = bytes fetched (the tier's kbps is its peak).
      const avg = tiers[i].size && dur > 0 ? (tiers[i].size * 8) / 1000 / dur : tiers[i].kbps;
      const est = abr.estimate(samples, avg);
      if (est) lastRate = est.rate;
      if (est && est.rate > 0) { lastKbps = est.kbps; store(BWKEY, { kbps: Math.round(est.kbps), at: Date.now() }); }
      if (manual || now < cool) return;
      const k = abr.nextTier(tiers, i, est, { ahead: end - t, stalled: waitAt != null && now - waitAt > 3000 });
      if (k !== i) { i = k; samples = []; cool = now + 8000; load(urlOf(i)); paint(); }
    }, 1000);
  }

  // 文稿: the captions as a list grouped by chapter; the line being heard is lit and kept in view
  // (scrolling only the list, never the page), a click plays from that line, the box filters it.
  let shown = null; // the video the transcript belongs to; a slower fetch for an earlier one is dropped
  const vttLib = import("/vtt.mjs");
  vttLib.catch(() => {}); // awaited (and its failure handled) in transcript()
  async function transcript(cur, vid) {
    shown = cur.slug;
    const box = $("#transcript");
    let cues;
    try {
      const [{ parseVtt, cueAt }, res] = await Promise.all([vttLib, fetch(cur.captions)]);
      if (!res.ok) return;
      cues = parseVtt(await res.text());
      if (shown !== cur.slug || !cues.length || !box.isConnected) return;
      box.hidden = false;
      $("summary", box).textContent = `文稿 · ${cues.length} 句`;
      const list = $("ol", box), find = $(".find", box);
      const chapterAt = (i) => cur.chapters.findIndex((c, k) => cues[i].start + 0.05 >= c.start && (k === cur.chapters.length - 1 || cues[i].start + 0.05 < cur.chapters[k + 1].start));
      const draw = (q) => {
        const hit = (text) => !q || text.toLowerCase().includes(q.toLowerCase());
        const mark = (text) => {
          if (!q) return esc(text);
          const lo = text.toLowerCase(), ql = q.toLowerCase();
          let out = "", i = 0, j;
          while ((j = lo.indexOf(ql, i)) >= 0) { out += `${esc(text.slice(i, j))}<mark>${esc(text.slice(j, j + q.length))}</mark>`; i = j + q.length; }
          return out + esc(text.slice(i));
        };
        let html = "", lastCh = -2;
        cues.forEach((c, i) => {
          if (!hit(c.text)) return;
          const ch = cur.chapters.length > 1 ? chapterAt(i) : -1;
          if (ch !== lastCh && ch >= 0) html += `<li class="ch">${esc(cur.chapters[ch].title)}</li>`;
          lastCh = ch;
          html += `<li><button type="button" data-i="${i}"><span class="t">${fmt(c.start)}</span><span>${mark(c.text)}</span></button></li>`;
        });
        list.innerHTML = html || `<li class="none">没有找到“${esc(q)}”</li>`;
        lit = -2;
        follow(true);
      };
      let lit = -2;
      const follow = (jump) => {
        const i = cueAt(cues, vid.currentTime);
        if (i === lit) return;
        lit = i;
        let on = null;
        for (const b of list.querySelectorAll("button")) {
          const me = Number(b.dataset.i) === i;
          b.setAttribute("aria-current", String(me));
          if (me) on = b;
        }
        if (!on || !box.open) return;
        const top = on.offsetTop, bottom = top + on.offsetHeight;
        if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) list.scrollTo({ top: top - list.clientHeight / 3, behavior: jump ? "auto" : "smooth" });
      };
      list.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]");
        if (!b) return;
        vid.currentTime = cues[Number(b.dataset.i)].start;
        vid.play().catch(() => {});
      });
      find.addEventListener("input", () => draw(find.value.trim()));
      box.addEventListener("toggle", () => { lit = -2; follow(true); });
      vid.addEventListener("timeupdate", () => follow(false));
      vid.addEventListener("seeked", () => follow(true));
      draw("");
    } catch {
      // No transcript is fine: the captions track still works in the player.
    }
  }

  window.addEventListener("popstate", render);
  window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  fetch("videos.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((j) => { videos = j.videos ?? []; $("#count").textContent = videos.length ? `${videos.length} 个视频` : ""; render(); })
    .catch((e) => { main.innerHTML = `<p class="empty">视频清单加载失败（${esc(e.message)}），请刷新重试</p>`; });
})();
</script>
</body>
</html>
